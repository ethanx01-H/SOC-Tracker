{% extends "base.html" %}
{% block title %}Change password - Sentriq{% endblock %}
{% block content %}
<header class="topbar">
  <div>
    <p class="eyebrow">Account</p>
    <h1>Change password</h1>
  </div>
</header>
<section class="panel">
  {% if error %}<div class="message">{{ error }}</div>{% endif %}
  <form method="post" action="/account/password/" class="form-grid single">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <p>
      <label for="current_password">Current password</label>
      <input id="current_password" name="current_password" type="password" autocomplete="current-password" required>
    </p>
    <p>
      <label for="new_password">New password</label>
      <input id="new_password" name="new_password" type="password" autocomplete="new-password" minlength="10" required>
    </p>
    <p>
      <label for="confirm_password">Confirm new password</label>
      <input id="confirm_password" name="confirm_password" type="password" autocomplete="new-password" minlength="10" required>
    </p>
    <p class="muted">Use at least 10 characters with uppercase and lowercase letters, a number, and a symbol.</p>
    <button class="primary" type="submit">Change password</button>
  </form>
</section>
{% endblock %}
