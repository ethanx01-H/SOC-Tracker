<form method="post" action="/alerts/bulk/" class="bulk-form">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
  <div class="bulk-toolbar">
    <label for="bulk-action">Bulk action</label>
    <select id="bulk-action" name="action">
      <option value="assign_me">Assign selected to me</option>
      <option value="status:WIP">Set selected to WIP</option>
      <option value="status:Pending">Set selected to Pending</option>
      <option value="status:Open">Set selected to Open</option>
    </select>
    <button type="submit">Apply to selected</button>
  </div>
  <div class="table">
  {% for alert in alerts %}
    <div class="table-row">
      <input type="checkbox" class="row-check" name="ids" value="{{ alert.id }}" aria-label="Select {{ alert.alert_id }}">
      <a class="button" href="{{ alert.get_absolute_url() }}">{{ alert.alert_id }}</a>
      <strong>{{ alert.title }}</strong>
      <span class="severity-{{ alert.severity }}">{{ alert.severity }}</span>
      <span class="pill status-{{ alert.status|lower }}">{{ alert.status }}</span>
      {% set sla = sla_status(alert) %}
      <span class="pill {{ sla.class }}">{{ sla.label }}</span>
      <span>{{ alert.source }}</span>
      <span>{{ alert.analyst }}</span>
    </div>
  {% else %}
    <div class="empty">No alerts found</div>
  {% endfor %}
  </div>
</form>
