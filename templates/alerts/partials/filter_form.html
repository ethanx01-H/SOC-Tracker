<form method="get" class="filters" data-filter-form>
  {% if active_range and active_range != 'all' and not (date_from or date_to) %}
    <input type="hidden" name="range" value="{{ active_range }}">
  {% endif %}
  <input name="q" value="{{ request.query_params.get('q', '') }}" placeholder="Search alerts, assets, IOCs" autocomplete="off" spellcheck="false" aria-label="Search alerts">
  <select name="severity" aria-label="Severity">
    <option value="">All severities</option>
    {% for severity in severities %}
      <option value="{{ severity }}" {% if request.query_params.get('severity') == severity %}selected{% endif %}>{{ severity_labels[severity] }}</option>
    {% endfor %}
  </select>
  <select name="status" aria-label="Status">
    <option value="">All statuses</option>
    {% for status in statuses %}
      <option value="{{ status }}" {% if request.query_params.get('status') == status %}selected{% endif %}>{{ status }}</option>
    {% endfor %}
  </select>
  <span class="date-pair">
    <label class="date-field" title="Show tickets filed on or after this day">
      <span>From</span>
      <span class="date-input">
        <input type="text" name="from" value="{{ date_from }}" placeholder="dd/mm/yyyy"
               inputmode="numeric" autocomplete="off" spellcheck="false" maxlength="10"
               aria-label="From date" data-date-text data-date-label="From date">
        <button type="button" class="date-clear" data-date-clear aria-label="Clear from date" title="Clear" hidden>&times;</button>
        <button type="button" class="date-open" data-date-open aria-label="Open calendar" title="Open calendar">
          <svg viewBox="0 0 16 16" aria-hidden="true" focusable="false"><rect x="1.5" y="3" width="13" height="11.5" rx="2"/><path d="M1.5 6.5h13M5 1.5v3M11 1.5v3"/></svg>
        </button>
      </span>
    </label>
    <label class="date-field" title="Show tickets filed on or before this day">
      <span>To</span>
      <span class="date-input">
        <input type="text" name="to" value="{{ date_to }}" placeholder="dd/mm/yyyy"
               inputmode="numeric" autocomplete="off" spellcheck="false" maxlength="10"
               aria-label="To date" data-date-text data-date-label="To date">
        <button type="button" class="date-clear" data-date-clear aria-label="Clear to date" title="Clear" hidden>&times;</button>
        <button type="button" class="date-open" data-date-open aria-label="Open calendar" title="Open calendar">
          <svg viewBox="0 0 16 16" aria-hidden="true" focusable="false"><rect x="1.5" y="3" width="13" height="11.5" rx="2"/><path d="M1.5 6.5h13M5 1.5v3M11 1.5v3"/></svg>
        </button>
      </span>
    </label>
  </span>
  <button type="submit">Filter</button>
</form>
