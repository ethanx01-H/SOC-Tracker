# Example host-level Nginx site. Install valid certificates before enabling TLS.
limit_req_zone $binary_remote_addr zone=soc_login:10m rate=10r/m;

server {
    listen 80;
    server_name sentriq.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name sentriq.example.com;

    ssl_certificate /etc/letsencrypt/live/sentriq.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sentriq.example.com/privkey.pem;
    client_max_body_size 25m;

    location = /login/ {
        limit_req zone=soc_login burst=10 nodelay;
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/proxy_params;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/proxy_params;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
